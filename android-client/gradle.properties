# =============================================================================
#  Свойства сборки Android-клиента.
# =============================================================================

# Память для демона Gradle. 2 ГиБ достаточно для однмодульного проекта
# и не вытесняет из памяти Android Studio.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Параллельная сборка и кеш конфигурации ускоряют инкрементальные сборки.
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX обязателен: библиотеки поддержки больше не публикуются.
android.useAndroidX=true

# Отключаем неиспользуемые возможности AGP - меньше работы на каждой сборке.
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# Стиль кодирования Kotlin.
kotlin.code.style=official
